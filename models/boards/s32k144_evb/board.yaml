# S32K144EVB-Q100（SCH-29248 Rev B）板卡数据卡。
# 硬约束：每个数值必须有来源；查不到 = null + UNVERIFIED，不填估计值。
# 本板是 three-board 库里唯一外形全 UNVERIFIED 的：NXP 官方机械图/原理图
# （S32K144EVB-SCH-29248-RB1）需登录下载；公开 QSG 只给上限包络。
board: s32k144_evb
unit: m

outline:
  length: null      # UNVERIFIED：QSG 仅 "supports up to 6in x 4in"（上限，非外形）
  width: null       # UNVERIFIED：同上
  thickness: null   # UNVERIFIED：无公开板厚标注

mount_holes: null   # UNVERIFIED：存在性与孔位均无公开来源；UNO 排针兼容 ≠ UNO 孔位

camera_interface:
  position_xyz: null        # UNVERIFIED：板上无摄像头连接器
  suggested_pitch_deg: null # UNVERIFIED：正前方基准角由几何→阈值映射层定义（本单不做）
  fov_deg: null             # UNVERIFIED：板上无自带摄像头模组

power_and_cable:
  usb: "Micro-USB（OpenSDA 调试/供电口）；另有外部 5-12V 电源口"
  dvp_cable_exit: null      # UNVERIFIED：无板载 DVP 连接器

# 挂载点 = 模型库设计建议（约定）。本板外形 UNVERIFIED → 坐标暂为原点骨架，
# 拿到官方机械图后按约定（长边端中心/板中心，z=0 板厚中面）回填。
mount_points:
  convention: "design-suggestion, not measured board feature; skeleton pending official drawing"
  mount_camera: [0.0, 0.0, 0.0]   # UNVERIFIED-derived skeleton
  mount_sensor: [0.0, 0.0, 0.0]   # UNVERIFIED-derived skeleton
  mount_bracket: [0.0, 0.0, 0.0]  # UNVERIFIED-derived skeleton

